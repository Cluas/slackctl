name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./cmd/slackctl/

      - name: Cross-compile for Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/slackctl/
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./cmd/slackctl/

      - run: go vet ./...

      - run: go test ./...
